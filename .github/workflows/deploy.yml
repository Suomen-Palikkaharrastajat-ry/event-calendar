name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup vendor
        run: make vendor

      - name: Setup Nix + devenv
        uses: ./vendor/master-builder/.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Elm cache
        id: elm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elm
            elm-app/elm-stuff
          key: elm-${{ runner.os }}-${{ hashFiles('elm-app/elm.json') }}
          restore-keys: elm-${{ runner.os }}-

      - name: Restore Cabal index cache
        id: cabal-index-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cabal/packages
          key: cabal-index-${{ runner.os }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: cabal-index-${{ runner.os }}-

      - name: Restore Cabal store cache
        id: cabal-store-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cabal/store
          key: cabal-store-${{ runner.os }}-${{ hashFiles('cabal.project.freeze', 'statics/statics.cabal', 'devenv.lock', 'devenv.nix', 'overrides.nix') }}
          restore-keys: cabal-store-${{ runner.os }}-

      - name: Update Cabal package index
        run: devenv shell --profile ci -- cabal update

      # TODO: add `make check` here once the pre-existing elm-review violations
      # are cleared (28 errors in 28 files, mostly RequireModuleDoc on tests/).
      # planet already runs this step; see docs/conventions.md.
      - name: Run tests
        run: devenv shell --profile ci -- make test

      - name: Build
        run: devenv shell --profile ci -- make dist-ci

      - name: Save Cabal store cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cabal/store
          key: ${{ steps.cabal-store-restore.outputs.cache-primary-key }}

      - name: Save Cabal index cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cabal/packages
          key: ${{ steps.cabal-index-restore.outputs.cache-primary-key }}

      - name: Save Elm cache
        if: steps.elm-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elm
            elm-app/elm-stuff
          key: ${{ steps.elm-cache-restore.outputs.cache-primary-key }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke-test.sh
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}

  build-update-binary:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Native Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'
          update-index: false

      - name: Build Native Binary
        run: |
          rm -f cabal.project.freeze
          bash -c "cd /tmp && cabal update"
          cabal install statics --installdir=.bin --install-method=copy

      - name: Cache Native Binary
        uses: actions/cache/save@v4
        with:
          path: .bin
          key: statics-native-bin-${{ github.sha }}
