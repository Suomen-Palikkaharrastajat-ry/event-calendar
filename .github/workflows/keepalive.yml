name: Keepalive

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. Re-enabling them through the API resets that
# timer, so no dummy commits are needed. This workflow is scheduled too, so
# it re-enables itself as well. Workflows disabled by hand are left alone.
on:
  schedule:
    - cron: '17 4 1,15 * *' # Twice per month
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in scheduled.yml keepalive.yml; do
            url="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}"
            state="$(gh api "$url" --jq .state)"
            if [ "$state" = disabled_manually ]; then
              echo "Skipped $workflow (disabled manually)"
              continue
            fi
            gh api --method PUT "$url/enable"
            echo "Re-enabled $workflow (was $state)"
          done
